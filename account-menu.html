<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Меню компании — Отзыв.com</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.wrap{width:min(920px,calc(100% - 28px));margin:auto}header{background:#101828;color:#fff}.top{min-height:64px;display:flex;align-items:center}.brand{color:#fff;text-decoration:none;font-size:23px;font-weight:900}.brand span{color:#53b1fd}main{padding:32px 0}.back{color:#175cd3;text-decoration:none;font-weight:700}h1{font-size:34px;margin:22px 0 8px}.lead{color:#667085;line-height:1.55}.card{margin-top:24px;background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:12px;font-weight:800}.muted{color:#667085}</style></head><body><header><div class="wrap top"><a class="brand" href="https://отзыв.com/">отзыв<span>.com</span></a></div></header><main class="wrap"><a class="back" id="back" href="account-home.html">← Мои компании</a><h1>Меню компании</h1><p class="lead" id="company">Загружаем компанию…</p><section class="card"><span class="badge">Модуль меню</span><h2>Меню пока не настроено</h2><p class="muted">Здесь будет управление меню компании. Это отдельный модуль, который сможет использовать публичный профиль и сервис приёма заказов.</p></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';const s=createClient('https://rzhlcszqtuhkhfibygnk.supabase.co','sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-');const q=new URLSearchParams(location.search),id=q.get('company_id');const{data:{session}}=await s.auth.getSession();if(!session){location.replace('account-login.html?next='+encodeURIComponent('account-menu.html'+location.search))}else{const{data,error}=await s.rpc('get_my_companies');const row=!error&&data?.find(x=>x.company?.id===id);if(!row){document.getElementById('company').textContent='Компания недоступна или не выбрана.'}else{localStorage.setItem('otzovik_active_company_id',id);sessionStorage.setItem('otzovik_active_company_id',id);document.getElementById('company').textContent=row.company.name;document.getElementById('back').href='account-home.html'}}</script></body></html>
