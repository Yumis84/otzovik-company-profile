<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Создать компанию — Отзыв.com</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(540px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:30px;box-shadow:0 12px 40px rgba(16,24,40,.08)}.brand{font-weight:900;font-size:23px;margin-bottom:25px}.brand span{color:#667085}h1{margin:0 0 8px}p{color:#667085;line-height:1.5}.field{display:block;margin:17px 0}.field span{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.hint{font-size:11px;color:#667085;margin-top:5px}.website-field,.profile-address-field{display:flex;align-items:center;border:1px solid #d0d5dd;border-radius:10px;background:#fff;overflow:hidden}.website-field{margin-top:8px}.website-field:focus-within,.profile-address-field:focus-within{border-color:#98a2b3}.website-prefix,.profile-suffix{display:flex!important;align-items:center;margin:0!important;color:#667085;white-space:nowrap;font-size:16px!important;font-weight:500!important;line-height:1}.website-prefix{padding:0 0 0 14px}.profile-suffix{padding:0 14px 0 0}.website-field input,.profile-address-field input{border:0;border-radius:0;outline:0;min-width:0;height:52px;font-size:16px}.website-field input{padding:12px 14px 12px 2px}.profile-address-field input{padding:12px 2px 12px 14px}.website-field input::placeholder,.profile-address-field input::placeholder{color:#98a2b3;opacity:1}button{width:100%;border:0;border-radius:10px;padding:13px;background:#101828;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.status{min-height:22px;margin-top:15px;font-size:13px}.error{color:#b42318}.ok{color:#027a48}.back{display:inline-block;margin-top:20px;color:#475467;text-decoration:none;font-size:13px}</style></head><body><main class="card"><div class="brand">отзыв<span>.com</span></div><h1>Создать компанию</h1><p>Компания станет отдельной сущностью вашего аккаунта. После создания вы автоматически получаете роль владельца и начинаете оформление профиля.</p><form id="form"><label class="field"><span>Название компании *</span><input id="name" maxlength="200" required></label><label class="field"><span>Адрес профиля *</span><div class="profile-address-field"><input id="slug" maxlength="64" required><span class="profile-suffix">.отзыв.com</span></div><div class="hint">Адрес формируется автоматически из названия компании. При необходимости его можно изменить.</div></label><div class="field"><span style="display:block;margin-bottom:7px">Дополнительно</span><input id="city" placeholder="Город"><div class="website-field"><span class="website-prefix">https://</span><input id="website" type="text" inputmode="url" autocomplete="url"></div><div class="hint">Если своего сайта нет, будет использоваться адрес профиля на Отзыв.com.</div><input id="phone" placeholder="Телефон" style="margin-top:8px"><input id="email" type="email" placeholder="Email компании" style="margin-top:8px"></div><button id="submit">Создать компанию</button></form><div id="status" class="status" role="status"></div><a class="back" href="account-home.html">← Вернуться к моим компаниям</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';const s=createClient('https://rzhlcszqtuhkhfibygnk.supabase.co','sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-');const f=document.getElementById('form'),b=document.getElementById('submit'),st=document.getElementById('status'),nameEl=document.getElementById('name'),slugEl=document.getElementById('slug'),websiteEl=document.getElementById('website');const msg=(t,c='')=>{st.textContent=t;st.className='status '+c};const slugify=v=>(v||'').toLowerCase().trim().replace(/^https?:\/\//i,'').replace(/\.отзыв\.com$/i,'').replace(/[^\p{L}\p{N}-]+/gu,'-').replace(/^-+|-+$/g,'').slice(0,64);const stripProtocol=v=>(v||'').trim().replace(/^https?:\/\//i,'');const defaultSite=()=>{const slug=slugEl.value.trim();return slug?slug+'.отзыв.com':''};const toAsciiSlug=v=>{const display=slugify(v);if(!display)return '';try{return new URL('https://'+display+'.отзыв.com').hostname.split('.')[0]}catch{return ''}};const syncFallback=()=>{if(!websiteEl.value)websiteEl.placeholder=defaultSite()};const syncFromName=()=>{if(!slugEl.dataset.edited)slugEl.value=slugify(nameEl.value);syncFallback()};nameEl.addEventListener('input',syncFromName);slugEl.addEventListener('input',e=>{e.target.value=slugify(e.target.value);e.target.dataset.edited='1';syncFallback()});websiteEl.addEventListener('input',e=>{const clean=stripProtocol(e.target.value);if(clean!==e.target.value)e.target.value=clean;syncFallback()});const normalizeWebsite=v=>{const domain=stripProtocol(v);if(!domain)return '';try{const u=new URL('https://'+domain);return u.hostname.includes('.')?u.href:''}catch{return ''}};const{data:{session}}=await s.auth.getSession();if(!session){location.replace('account-login.html')}f.addEventListener('submit',async e=>{e.preventDefault();const name=nameEl.value.trim(),displaySlug=slugify(slugEl.value),slug=toAsciiSlug(displaySlug),city=document.getElementById('city').value.trim(),websiteInput=websiteEl.value.trim()||defaultSite(),website=normalizeWebsite(websiteInput),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim();if(!name||!displaySlug||!slug||!/^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$/.test(slug)){msg('Проверьте название и адрес профиля.','error');return}if(websiteInput&&!website){msg('Проверьте адрес сайта.','error');return}b.disabled=true;msg('Создаём компанию…');const{data,error}=await s.rpc('create_my_company',{p_name:name,p_slug:slug,p_website:website||null,p_phone:phone||null,p_city:city||null,p_email:email||null});if(error){msg(error.message==='Company slug is already taken'?'Такой адрес уже занят. Выберите другой.':error.message||'Не удалось создать компанию.','error');b.disabled=false;return}const result=Array.isArray(data)?data[0]:data;const company=result?.company;const reservedSlug=result?.company?.slug;const publicUrl=result?.company?.public_url;if(!company?.id||!reservedSlug){msg('Компания создана, но ссылка профиля не получена.','error');b.disabled=false;return}if(typeof publicUrl!=='string'||!/^https:\/\/[^/]+\\.xn--b1ajuq0c\\.com\/$/.test(publicUrl)){msg('Компания создана, но корректная ссылка профиля не получена.','error');b.disabled=false;return}st.textContent='Компания создана. Вы — её владелец. ';const link=document.createElement('a');link.href=publicUrl;link.textContent='Открыть публичный профиль';link.target='_blank';link.rel='noopener';st.appendChild(link);st.className='status ok';setTimeout(()=>location.replace('account-profile.html?company_id='+encodeURIComponent(company.id)),1500)});</script></body></html>
