<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Услуги специалиста | Отзыв.com</title><link rel="stylesheet" href="account-specialist-ui.css"><link rel="stylesheet" href="account-profile-shell.css"><link rel="stylesheet" href="account-profile-navigation.css"></head><body><main class="wrap"><a class="brand" href="account-home.html">отзыв.com · Мои профили</a><h1>Услуги</h1><p id="profile-name">Загрузка специалиста…</p><nav class="editor-nav" aria-label="Разделы профиля специалиста"></nav><p class="notice">Приватный черновик. Ничего из этого раздела не публикуется автоматически.</p><p id="status" role="status" aria-live="polite">Загрузка…</p><section class="card"><h2 id="form-title">Добавить услугу</h2><form id="service-form"><fieldset id="fields" disabled><label>Название *<input id="name" required minlength="2" maxlength="150"></label><label>Описание<textarea id="description" maxlength="2000"></textarea></label><div class="grid"><label>Стоимость от<input id="price-from" type="number" min="0" max="100000000" step="0.01"></label><label>Стоимость до<input id="price-to" type="number" min="0" max="100000000" step="0.01"></label><label>Валюта<select id="currency"><option>RUB</option><option>USD</option><option>EUR</option></select></label><label>Длительность, минут<input id="duration" type="number" min="1" max="1440" step="1"></label></div><label><input type="checkbox" id="active" checked>Услуга доступна (в приватном черновике)</label><div class="actions"><button id="save">Сохранить услугу</button><button id="cancel" type="button" class="secondary">Новая услуга</button></div></fieldset></form></section><section class="card"><h2>Ваши услуги</h2><div id="items"></div></section></main><script type="module" src="account-specialist-services.js"></script></body></html>
