<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Услуги специалиста | Отзыв.com</title><link rel="stylesheet" href="account-preview.css"><link rel="stylesheet" href="account-specialist-ui.css"></head><body><header><div class="wrap top"><a class="brand" href="https://отзыв.com/">отзыв<span>.com</span></a><b role="link" tabindex="0" onclick="location.href='account-home.html'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.href='account-home.html'}" style="cursor:pointer">ЛИЧНЫЙ КАБИНЕТ</b></div></header><main class="wrap"><nav class="editor-nav" aria-label="Навигация кабинета"></nav><section id="specialist-context" class="specialist-context" hidden></section><div class="specialist-editor"><h1>Услуги</h1><p id="profile-name">Загрузка специалиста…</p><p class="notice">Приватный черновик. Ничего из этого раздела не публикуется автоматически.</p><p id="status" role="status" aria-live="polite">Загрузка…</p><section class="card"><h2 id="form-title">Добавить услугу</h2><form id="service-form"><fieldset id="fields" disabled><label>Название *<input id="name" required minlength="2" maxlength="150"></label><label>Описание<textarea id="description" maxlength="2000" placeholder="Что входит в услугу, что нужно от клиента и какой результат он получит"></textarea></label><p id="pricing-note" class="notice"></p><div class="grid"><label>Стоимость<select id="price-mode"><option value="unspecified">Не указана</option><option value="priced">Указать цену</option><option value="negotiated">По договорённости</option></select></label><label>Единица стоимости<select id="price-unit"><option value="">Не указана</option><option value="service" selected>За услугу</option><option value="hour">За час</option><option value="lesson">За занятие</option><option value="day">За день</option><option value="square_meter">За м²</option><option value="project">За проект</option></select></label></div><div class="grid"><label>Стоимость от<input id="price-from" type="number" min="0" max="100000000" step="any"></label><label>Стоимость до<input id="price-to" type="number" min="0" max="100000000" step="any"></label><label>Валюта<select id="currency"><option>RUB</option><option>USD</option><option>EUR</option></select></label><label>Длительность, минут (необязательно)<input id="duration" type="number" min="1" max="1440" step="1"></label></div><label><input type="checkbox" id="active" checked>Услуга доступна (в приватном черновике)</label><div class="actions"><button id="save">Сохранить услугу</button><button id="cancel" type="button" class="secondary">Новая услуга</button></div></fieldset></form></section><section class="card"><h2>Ваши услуги</h2><button type="button" id="reload-services" class="secondary">Перезагрузить услуги</button><div id="items"></div></section></div></main><script type="module" src="account-specialist-services.js"></script></body></html>
