x-width:620px){.company-card .actions{grid-template-columns:1fr}.specialist-card .actions a{white-space:normal}}.specialist-card .specialist-identity{display:flex;align-items:center;gap:12px;min-width:0;flex:1}.specialist-card .specialist-avatar{width:50px;height:50px;flex:0 0 50px;border-radius:13px;background:#f1edff;border:1px solid #e9e2ff;color:#7755b7;display:grid;place-items:center}.specialist-card .specialist-avatar svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.specialist-card .specialist-info{min-width:0;flex:1}@media(max-width:620px){.specialist-card .specialist-avatar{width:44px;height:44px;flex-basis:44px}.specialist-card .specialist-identity{gap:10px}}.company-card{border:1px solid #e0e7f0;box-shadow:0 3px 15px rgba(16,24,40,.035);padding:16px 17px;margin-bottom:13px}.company-card .row{align-items:flex-start;gap:12px}.company-card .row>div{min-width:0;flex:1}.company-card .name{font-size:19px;line-height:1.3}.company-card .meta{font-size:12px;line-height:1.55;margin-top:5px;overflow-wrap:anywhere}.company-card .status{font-size:11px;background:#ecfdf3;color:#027a48;padding:5px 9px}.company-card .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px;padding-top:12px}.company-card .actions a{min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;background:#f3f6fb;color:#175cd3;border:1px solid #edf1f7;font-size:13px;font-weight:750;text-decoration:none;padding:10px 12px}.company-card .actions a:hover{background:#e8effb}.company-card .actions .edit-link{grid-column:1/-1;grid-row:auto;background:#eaf2ff;color:#175cd3;border-color:#e0eaff;min-height:45px}.company-card .actions .edit-link:hover{background:#dbeaff}.company-card .actions a:focus-visible{outline:3px solid #84caff;outline-offset:2px}.company-card .action-icon{width:18px;height:18px;display:inline-block;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.company-card .status-ready::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#12b76a;margin-right:6px}.company-card .status-draft{background:#fff4e5;color:#92400e}.company-card .status-draft::before{background:#f59e0b}@media(max-width:620px){.company-card{padding:15px}.company-card .row{flex-direction:row;align-items:flex-start}.company-card .actions{grid-template-columns:repeat(2,minmax(0,1fr))}.company-card .actions a{min-height:44px;font-size:12px}.company-card .actions .edit-link{grid-column:1/-1;grid-row:auto}.company-card .status{white-space:nowrap}}.company-card .company-identity{display:flex;align-items:center;gap:12px;min-width:0;flex:1}.company-card .company-avatar{width:54px;height:54px;flex:0 0 54px;border-radius:13px;display:grid;place-items:center;background:#edf3fd;color:#4476c4;border:1px solid #e4ecf9}.company-card .company-avatar svg{display:block;width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.company-card .company-info{min-width:0;flex:1}.company-card .action-icon{display:block!important;width:19px!important;height:19px!important;min-width:19px;flex-shrink:0;vertical-align:middle}@media(max-width:620px){.company-card .company-avatar{width:45px;height:45px;flex-basis:45px}.company-card .company-avatar svg{width:25px;height:25px}.company-card .company-identity{gap:10px}.company-card .name{font-size:17px}}.company-card{background:#fff;border-color:#d0d7e2;box-shadow:0 7px 22px rgba(16,24,40,.09);margin-bottom:18px}.company-card .actions a{border-color:#dce4ef}.company-card .actions .edit-link{border-color:#cbdcf8}@media(max-width:620px){body{background:#f0f2f5}.company-card{box-shadow:0 6px 19px rgba(16,24,40,.095);margin-bottom:18px}}</style></head><body><header><div class="wrap top"><a class="brand" href="https://отзыв.com/">отзыв<span>.com</span></a><div class="account-tools"><span class="user" id="user"></span><button class="logout" id="logout" type="button">Выйти</button></div></div></header><main class="wrap"><section class="head"><div><h1>Мои профили</h1><p>Личный кабинет пользователя. Здесь находятся компании и специалисты, которыми вы управляете.</p></div><a class="primary" href="account-create-profile.html">+ Добавить профиль</a></section><section id="invites"></section><section id="list"></section><p id="status"></p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';const s=createClient('https://rzhlcszqtuhkhfibygnk.supabase.co','sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-');const list=document.getElementById('list'),invites=document.getElementById('invites'),status=document.getElementById('status'),user=document.getElementById('user'),logout=document.getElementById('logout');logout.addEventListener('click',async()=>{logout.disabled=true;await s.auth.signOut();location.replace('account-login.html')});const roleName=r=>({owner:'Владелец',admin:'Администратор',manager:'Менеджер',analyst:'Аналитик'}[r]||r);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const{data:{session}}=await s.auth.getSession();if(!session){location.replace('account-login.html');return}user.textContent=session.user.email||'';const result=async name=>{try{return await s.rpc(name)}catch{return {data:null,error:{message:'network'}}}};const [pending,companiesResult,specialistResult]=await Promise.all([result('get_my_pending_company_invitations'),result('get_my_companies'),result('get_my_specialists')]);if(!pending.error&&pending.data?.length){invites.innerHTML=pending.data.map(i=>'<article class="card invite-card"><h2>Вас приглашают управлять компанией</h2><b>'+esc(i.company_name||i.company_slug)+'</b><p>Роль: '+esc(i.role)+'</p><div class="invite-actions"><button class="accept" data-accept="'+i.id+'">Принять</button><button data-decline="'+i.id+'">Отклонить</button></div></article>').join('');invites.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await s.rpc('accept_my_company_invitation',{p_invitation_id:b.dataset.accept});if(r.error){alert(r.error.message);b.disabled=false;return}location.reload()});invites.querySelectorAll('[data-decline]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await s.rpc('decline_my_company_invitation',{p_invitation_id:b.dataset.decline});if(r.error){alert(r.error.message);b.disabled=false;return}location.reload()})}const{data,error}=companiesResult;const specialists=Array.isArray(specialistResult.data)?specialistResult.data:[];status.textContent=[pending.error?'Не удалось загрузить приглашения.':'',error?'Не удалось загрузить компании.':'',specialistResult.error?'Не удалось загрузить специалистов.':''].filter(Boolean).join(' ');if(!error&&!specialistResult.error&&!data?.length&&!specialists.length){list.innerHTML='<div class="card empty"><h2>Пока нет профилей</h2><p>Создайте профиль компании или индивидуального специалиста.</p><a class="primary" href="account-create-profile.html">Добавить профиль</a></div>';return}list.innerHTML=(error?[]:(data||[])).map(x=>{const c=x.company,m=x.membership;return `<article class="card company-card"><div class="row"><div class="company-identity"><span class="company-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V6l7-3v18M12 9h7v12M8 8v1M8 12v1M8 16v1M15 12h1M15 16h1"/></svg></span><div class="company-info"><a class="name public-profile-link" href="https://${encodeURIComponent(c.slug)}.xn--b1ajuq0c.com/" target="_blank" rel="noopener">${esc(c.name)}</a><div class="meta">${esc(c.city||'Город не указан')} · ${esc(c.slug)}.отзыв.com · роль: ${esc(roleName(m.role))}</div></div></div><span class="status ${c.profile_status==='ready'?'status-ready':'status-draft'}">${esc(c.profile_status==='ready'?'Готово':c.profile_status==='draft'?'Черновик':c.profile_status||'Черновик')}</span></div><div class="actions"><a class="edit-link" href="account-profile.html?company_id=${encodeURIComponent(c.id)}"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4z"/></svg> Редактировать профиль</a><a class="manage-link" href="account-services.html?company_id=${encodeURIComponent(c.id)}"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01"/></svg> Услуги</a>${m.role==='owner'?'<a class="access-link" href="account-access.html?company_id='+encodeURIComponent(c.id)+'"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Доступы</a>':'' }</div></article>`}).join('')+specialists.map(x=>'<article class="card specialist-card"><div class="row"><div class="specialist-identity"><span class="specialist-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><div class="specialist-info"><strong class="name">'+esc(x.display_name)+'</strong><div class="meta">Специалист · '+esc(x.profession||'Профессия не указана')+' · '+esc(x.city||'Город не указан')+'</div></div></div><span class="status">Черновик · только вам</span></div><div class="actions"><a class="edit-link" href="account-create-specialist.html?id='+encodeURIComponent(x.id)+'">✎ Редактировать специалиста</a></div></article>').join('');list.querySelectorAll('a[href*="company_id="]').forEach(a=>a.addEventListener('click',()=>{const id=new URL(a.href,location.href).searchParams.get('company_id');if(id){localStorage.setItem('otzovik_active_company_id',id);sessionStorage.setItem('otzovik_active_company_id',id)}}));}load().catch(()=>{status.textContent='Не удалось загрузить кабинет. Проверьте соединение и обновите страницу.'});</script></body></html>
