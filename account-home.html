<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Мои компании — личный кабинет | Отзыв.com</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.wrap{width:min(920px,calc(100% - 28px));margin:auto}header{background:#101828;color:#fff}.top{min-height:64px;display:flex;justify-content:space-between;align-items:center}.brand{color:#fff;text-decoration:none;font-size:23px;font-weight:900}.brand span{color:#53b1fd}.user{font-size:12px;opacity:.8}main{padding:30px 0 50px}h1{font-size:34px;margin:0 0 7px}p{color:#667085;line-height:1.5}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.primary{display:inline-block;padding:12px 16px;border-radius:10px;background:#101828;color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:20px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:16px;align-items:center}.name{display:inline-flex;align-items:center;gap:7px;font-size:20px;font-weight:850;color:#101828;text-decoration:none}.name::after{content:"";width:18px;height:18px;flex:0 0 18px;background:no-repeat center/18px 18px url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724%27 height=%2724%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23175cd3%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M14 5h5v5%27/%3E%3Cpath d=%27M10 14 19 5%27/%3E%3Cpath d=%27M19 13v6H5V5h6%27/%3E%3C/svg%3E");transition:transform .15s ease}.name:hover::after,.name:focus-visible::after{transform:translate(2px,-2px)}.name:hover,.name:focus-visible{color:#175cd3;text-decoration:underline;text-underline-offset:3px}.meta{font-size:12px;color:#667085;margin-top:5px}.status{font-size:10px;font-weight:850;padding:5px 8px;border-radius:999px;background:#ecfdf3;color:#027a48}.actions{display:flex;gap:10px;margin-top:15px}.actions a{font-size:12px;font-weight:800;color:#175cd3;text-decoration:none}.empty{text-align:center;padding:45px 20px}.empty h2{margin:0 0 7px}.danger{border:0;background:none;padding:0;color:#b42318;cursor:pointer;font:inherit;font-size:12px;font-weight:800}.danger:hover{text-decoration:underline}.danger:disabled{opacity:.5;cursor:wait}.logout{border:0;background:none;color:#d0d5dd;cursor:pointer;font:inherit;font-size:12px}.account-tools{display:flex;align-items:center;gap:12px}@media(max-width:620px){.head,.row{align-items:flex-start;flex-direction:column}.primary{width:100%;text-align:center}.actions{flex-wrap:wrap}}</style></head><body><header><div class="wrap top"><a class="brand" href="https://отзыв.com/">отзыв<span>.com</span></a><div class="account-tools"><span class="user" id="user"></span><button class="logout" id="logout" type="button">Выйти</button></div></div></header><main class="wrap"><section class="head"><div><h1>Мои компании</h1><p>Личный кабинет пользователя. Здесь находятся компании, которыми вы управляете.</p></div><a class="primary" href="account-create-company.html">+ Создать компанию</a></section><section id="list"></section><p id="status"></p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';const s=createClient('https://rzhlcszqtuhkhfibygnk.supabase.co','sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-');const list=document.getElementById('list'),status=document.getElementById('status'),user=document.getElementById('user'),logout=document.getElementById('logout');logout.addEventListener('click',async()=>{logout.disabled=true;await s.auth.signOut();location.replace('account-login.html')});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const{data:{session}}=await s.auth.getSession();if(!session){location.replace('account-login.html');return}user.textContent=session.user.email||'';const{data,error}=await s.rpc('get_my_companies');if(error){status.textContent='Не удалось загрузить компании.';return}if(!data?.length){list.innerHTML='<div class="card empty"><h2>Пока нет компаний</h2><p>Создайте первую компанию — вы автоматически станете её владельцем.</p><a class="primary" href="account-create-company.html">Создать первую компанию</a></div>';return}list.innerHTML=data.map(x=>{const c=x.company,m=x.membership;return `<article class="card"><div class="row"><div><a class="name" href="account-profile.html?company_id=${encodeURIComponent(c.id)}">${esc(c.name)}</a><div class="meta">${esc(c.city||'Город не указан')} · ${esc(c.slug)}.отзыв.com · роль: ${esc(m.role)}</div></div><span class="status">${esc(c.profile_status||'draft')}</span></div><div class="actions"><a href="https://${encodeURIComponent(c.slug)}.xn--b1ajuq0c.com/" target="_blank" rel="noopener">Публичный профиль ↗</a><a href="account-sources.html?company_id=${encodeURIComponent(c.id)}">Источники отзывов</a>${m.role==="owner"?"<button class=\"danger\" type=\"button\" data-delete-id=\""+esc(c.id)+"\" data-delete-name=\""+esc(c.name)+"\">Удалить компанию</button>":""}</div></article>`}).join('');list.querySelectorAll('[data-delete-id]').forEach(btn=>btn.addEventListener('click',()=>removeCompany(btn)))}async function removeCompany(btn){const id=btn.dataset.deleteId,name=btn.dataset.deleteName;const typed=prompt('Компания будет удалена без возможности восстановления. Введите точное название компании:\n\n'+name);if(typed===null)return;if(typed.trim()!==name.trim()){alert('Название не совпадает. Удаление отменено.');return}btn.disabled=true;status.textContent='Проверяем возможность удаления…';try{const{data:plan,error:planError}=await s.rpc('get_my_company_deletion_plan',{p_company_id:id});if(planError)throw planError;if(!plan?.can_delete)throw new Error('Удаление заблокировано сохранённой финансовой или отзывной историей.');const objects=Array.isArray(plan.storage_objects)?plan.storage_objects:[];if(objects.length){status.textContent='Удаляем файлы компании…';const{error:storageError}=await s.storage.from('company-media').remove(objects);if(storageError)throw storageError}status.textContent='Удаляем компанию…';const{data:deleted,error:deleteError}=await s.rpc('delete_my_company',{p_company_id:id});if(deleteError)throw deleteError;if(!deleted?.deleted)throw new Error('Сервер не подтвердил удаление.');localStorage.removeItem('otzovik_active_company_id');status.textContent='Компания удалена. Поддомен освобождён.';await load()}catch(e){console.error(e);status.textContent='Не удалось удалить компанию: '+(e?.message||'неизвестная ошибка');btn.disabled=false}}load();</script></body></html>
