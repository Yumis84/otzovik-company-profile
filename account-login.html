<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Личный кабинет — Отзыв.com</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(16,24,40,.08)}.brand{font-weight:900;font-size:23px;margin-bottom:25px}.brand span{color:#667085}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs button{flex:1;background:#f2f4f7;color:#475467}.tabs button.active{background:#101828;color:#fff}h1{margin:0 0 8px;font-size:27px}p{color:#667085;line-height:1.5}.field{display:block;margin:17px 0}.field span{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:13px;background:#101828;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.status{min-height:24px;margin-top:15px;font-size:13px}.error{color:#b42318}.ok{color:#027a48}.back{display:inline-block;margin-top:20px;color:#475467;text-decoration:none;font-size:13px}.secondary{background:#f2f4f7;color:#344054;margin-top:9px}</style></head><body><main class="card"><div class="brand">отзыв<span>.com</span></div><div class="tabs"><button type="button" id="loginTab" class="active">Войти</button><button type="button" id="signupTab">Регистрация</button></div><h1 id="title">Вход в личный кабинет</h1><p id="lead">Войдите в личный аккаунт. Компании управляются из него отдельно.</p><form id="form"><label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label><label class="field"><span>Пароль</span><input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button id="submit">Войти</button></form><div id="status" class="status" role="status" aria-live="polite"></div><a class="back" href="https://отзыв.com/">← Вернуться на Отзыв.com</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';const s=createClient('https://rzhlcszqtuhkhfibygnk.supabase.co','sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-');const form=document.getElementById('form'),b=document.getElementById('submit'),st=document.getElementById('status'),title=document.getElementById('title'),lead=document.getElementById('lead'),loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab');let mode='login';const show=(t,c='')=>{st.textContent=t;st.className='status '+c};function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');title.textContent=m==='login'?'Вход в личный кабинет':'Создание аккаунта';lead.textContent=m==='login'?'Войдите в личный аккаунт. Компании управляются из него отдельно.':'Создайте личный аккаунт по email и паролю, затем добавьте одну или несколько компаний.';b.textContent=m==='login'?'Войти':'Зарегистрироваться';show('')}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');async function route(){const{data:{session}}=await s.auth.getSession();if(!session)return;const{data,error}=await s.rpc('get_my_companies');if(error){show('Сессия активна, но не удалось определить компании.','error');return}location.replace(data?.length?'account-home.html':'account-create-company.html')}await route();form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){show('Введите корректный email и пароль не короче 6 символов.','error');return}b.disabled=true;show(mode==='login'?'Выполняем вход…':'Создаём аккаунт…');if(mode==='login'){const{error}=await s.auth.signInWithPassword({email,password});if(error){show('Не удалось войти. Проверьте данные и подтверждение email.','error');b.disabled=false;return}await route()}else{const{data,error}=await s.auth.signUp({email,password,options:{emailRedirectTo:new URL('account-login.html?verified=1',location.href).href}});if(error){show(error.message||'Не удалось зарегистрировать аккаунт.','error');b.disabled=false;return}if(data.session){show('Аккаунт создан. Переходим к созданию компании…','ok');setTimeout(()=>location.replace('account-create-company.html'),500)}else{show('Аккаунт создан. Проверьте почту и подтвердите email, затем войдите.','ok');b.disabled=false}}});</script></body></html>
