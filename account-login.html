<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Личный кабинет — Отзыв.com</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(16,24,40,.08)}.brand{display:inline-block;color:#101828;text-decoration:none;font-weight:900;font-size:23px;margin-bottom:25px}.brand span{color:#667085}.tabs{display:flex;gap:6px;margin-bottom:20px}.tabs button{flex:1;background:#f2f4f7;color:#475467}.tabs button.active{background:#101828;color:#fff}h1{margin:0 0 8px;font-size:27px}p{color:#667085;line-height:1.5}.field{display:block;margin:17px 0}.field span{display:block;font-size:13px;font-weight:750;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}button{width:100%;border:0;border-radius:10px;padding:13px;background:#101828;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.status{min-height:24px;margin-top:15px;font-size:13px}.error{color:#b42318}.ok{color:#027a48}.back{display:inline-block;margin-top:20px;color:#475467;text-decoration:none;font-size:13px}.secondary{background:#f2f4f7;color:#344054;margin-top:9px}</style></head><body><main class="card"><a class="brand" href="https://отзыв.com/">отзыв<span>.com</span></a><div class="tabs"><button type="button" id="loginTab" class="active">Войти</button><button type="button" id="signupTab">Регистрация</button></div><h1 id="title">Вход в личный кабинет</h1><p id="lead">Войдите в личный аккаунт. Компании и специалисты управляются из него отдельно.</p><form id="form"><label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label><label class="field"><span>Пароль</span><input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button id="submit">Войти</button></form><div id="status" class="status" role="status" aria-live="polite"></div><a class="back" href="https://отзыв.com/">← Вернуться на Отзыв.com</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/+esm';const s=createClient('https://rzhlcszqtuhkhfibygnk.supabase.co','sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-');const form=document.getElementById('form'),b=document.getElementById('submit'),st=document.getElementById('status'),title=document.getElementById('title'),lead=document.getElementById('lead'),loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab');let mode='login';const params=new URLSearchParams(location.search);const rawNext=params.get('next')||'';const safeNext=/^account-[a-z0-9-]+\.html(?:\?[^#]*)?$/i.test(rawNext)?rawNext:'';const destination=()=>safeNext||'account-home.html';const show=(t,c='')=>{st.textContent=t;st.className='status '+c};function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');signupTab.classList.toggle('active',m==='signup');title.textContent=m==='login'?'Вход в личный кабинет':'Создание аккаунта';lead.textContent=m==='login'?'Войдите в личный аккаунт для управления компаниями и специалистами.':'Создайте личный аккаунт по email и паролю, затем добавьте компанию или специалиста.';b.textContent=m==='login'?'Войти':'Зарегистрироваться';show('')}loginTab.onclick=()=>setMode('login');signupTab.onclick=()=>setMode('signup');async function route(){const {data,error}=await s.auth.getSession();if(error)throw error;if(data?.session){location.replace(destination());return true;}return false;}
try{await route();}catch{show('Не удалось проверить сессию. Попробуйте войти снова.','error');}
let busy=false;
form.addEventListener('submit',async e=>{
 e.preventDefault();if(busy)return;
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||password.length<6){show('Введите корректный email и пароль не короче 6 символов.','error');return;}
 busy=true;b.disabled=true;const submittedMode=mode;loginTab.disabled=true;signupTab.disabled=true;
 show(submittedMode==='login'?'Выполняем вход…':'Создаём аккаунт…');
 try{
  if(submittedMode==='login'){
   const {error}=await s.auth.signInWithPassword({email,password});
   if(error){show('Не удалось войти. Проверьте данные и подтверждение email.','error');return;}
   if(!await route())show('Не удалось открыть сессию. Попробуйте войти снова.','error');
  }else{
   const signupNext=safeNext||'account-create-profile.html';
   const {data,error}=await s.auth.signUp({email,password,options:{emailRedirectTo:new URL('account-login.html?verified=1&next='+encodeURIComponent(signupNext),location.href).href}});
   if(error){show('Не удалось зарегистрировать аккаунт. Проверьте данные и попробуйте снова.','error');return;}
   if(data?.session){show('Аккаунт создан. Переходим к выбору профиля…','ok');location.replace(signupNext);}
   else show('Аккаунт создан. Проверьте почту и подтвердите email, затем войдите.','ok');
  }
 }catch{show('Не удалось подключиться. Проверьте соединение и попробуйте снова.','error');}
 finally{busy=false;b.disabled=false;loginTab.disabled=false;signupTab.disabled=false;}
});</script></body></html>
