name: Shared navigation isolated browser
on: [pull_request]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: otzovik_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d otzovik_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/pages-artifact.mjs
      - run: node tests/shared-navigation-browser.mjs
      - run: node tests/company-navigation-browser.mjs
      - run: node tests/specialist-ux-browser.mjs
        env:
          UX_SCREENSHOT_DIR: navigation-screenshots
          TEST_DATABASE_URL: postgres://postgres:acceptance-only@127.0.0.1:5432/otzovik_acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-screenshots
          path: navigation-screenshots/*.png
          if-no-files-found: ignore
