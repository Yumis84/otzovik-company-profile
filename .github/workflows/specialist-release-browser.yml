name: Specialist release browser PostgreSQL 17
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  release-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: otzovik_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d otzovik_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/specialist-ux-browser.mjs
        env:
          TEST_DATABASE_URL: postgres://postgres:acceptance-only@127.0.0.1:5432/otzovik_acceptance
      - name: Company source invariance
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha }} HEAD -- 'account*.html' 'account*.js' 'account*.css' ':!account-specialist*' ':!account-create-specialist.html'
          test ! -d supabase/migrations
