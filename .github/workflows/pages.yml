name: Deploy static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public Pages artifact
        run: |
          mkdir -p public-site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.md' -o -name '*.txt' -o -name '.nojekyll' \) ! -name 'package.json' ! -name 'package-lock.json' ! -name 'test-*' -exec cp {} public-site/ \;
          cp -R reviews public-site/reviews
          test -f public-site/reviews/index.html
          test -f public-site/index.html
          test -f public-site/account-create-specialist.html
          test ! -e public-site/sql
          test ! -e public-site/tests
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
