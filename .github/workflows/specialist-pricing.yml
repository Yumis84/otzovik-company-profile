name: Specialist pricing PostgreSQL 17
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pricing:
    name: PG17 / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: SQL and rollback
            test: tests/specialist-pricing.mjs
            browser: false
          - suite: Browser
            test: tests/specialist-pricing-browser.mjs
            browser: true
          - suite: Media races
            test: tests/specialist-pricing-media-races.mjs
            browser: false
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: otzovik_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d otzovik_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:acceptance-only@127.0.0.1:5432/otzovik_acceptance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify PostgreSQL major version
        run: |
          node --input-type=module -e "import pg from 'pg';const c=new pg.Client({connectionString:process.env.TEST_DATABASE_URL});await c.connect();const r=await c.query('SHOW server_version_num');if(Math.floor(Number(r.rows[0].server_version_num)/10000)!==17)throw Error('PostgreSQL17 required');await c.end();"
      - run: npm run test:pages
      - if: matrix.browser
        run: npx playwright install --with-deps chromium
      - name: Run isolated acceptance
        env:
          PRICING_SCREENSHOT_DIR: ${{ runner.temp }}/pricing-screenshots
        run: node ${{ matrix.test }}
      - name: Company byte gate and safe candidate location
        run: |
          git diff --exit-code ${{ github.event.pull_request.base.sha || 'HEAD' }} HEAD -- 'account*.html' 'account*.js' 'account*.css' ':!account-specialist*' ':!account-create-specialist.html'
          test ! -d supabase/migrations
      - if: always() && matrix.browser
        uses: actions/upload-artifact@v4
        with:
          name: pricing-screenshots-${{ github.run_id }}
          path: ${{ runner.temp }}/pricing-screenshots
          if-no-files-found: ignore
