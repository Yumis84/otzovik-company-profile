name: Specialist contact channels
on:
  pull_request:
    branches: [main, work/specialist-stage2a-20261022]
permissions:
  contents: read
jobs:
  channels:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: otzovik_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d otzovik_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:pages
      - name: Channel RPCs, roles and overlapping transactions on fresh disposable PostgreSQL
        run: npm run test:channels
        env:
          TEST_DATABASE_URL: postgres://postgres:acceptance-only@127.0.0.1:5432/otzovik_acceptance
      - run: npx playwright install --with-deps chromium
      - name: Channel browser and fallback against disposable SQL
        run: npm run test:channels:browser
